<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="AI Video Transformer overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="80" y="80" width="1440" height="740" rx="16" fill="#0c0c0e" stroke="#27272a" stroke-width="2"/>
  <text x="120" y="160" fill="#f97316" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="3">AI VIDEO TRANSFORMER</text>
  <text x="120" y="240" fill="#fafafa" font-family="Georgia, serif" font-size="52">Video-to-video AI pipeline</text>
  <text x="120" y="300" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="24">Upload → Magic Hour transform → webhook → durable Cloudinary output</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#e4e4e7">
    <rect x="120" y="380" width="250" height="110" rx="10" fill="#18181b" stroke="#3f3f46"/>
    <text x="145" y="430">Uploadcare</text>
    <text x="145" y="460" fill="#71717a">Direct browser upload</text>
    <rect x="400" y="380" width="250" height="110" rx="10" fill="#18181b" stroke="#3f3f46"/>
    <text x="425" y="430">Cloudinary</text>
    <text x="425" y="460" fill="#71717a">Source + generated</text>
    <rect x="680" y="380" width="250" height="110" rx="10" fill="#18181b" stroke="#3f3f46"/>
    <text x="705" y="430">Magic Hour</text>
    <text x="705" y="460" fill="#71717a">Async V2V jobs</text>
    <rect x="960" y="380" width="250" height="110" rx="10" fill="#18181b" stroke="#3f3f46"/>
    <text x="985" y="430">MongoDB</text>
    <text x="985" y="460" fill="#71717a">Lifecycle source of truth</text>
    <rect x="1240" y="380" width="220" height="110" rx="10" fill="#18181b" stroke="#3f3f46"/>
    <text x="1265" y="430">Webhook</text>
    <text x="1265" y="460" fill="#71717a">HMAC verified</text>
  </g>
  <rect x="120" y="540" width="1320" height="200" rx="12" fill="#09090b" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="160" y="610" fill="#fafafa" font-family="system-ui, sans-serif" font-size="26">Adaptive TanStack Query polling · no WebSockets · Vercel deploy</text>
  <text x="160" y="665" fill="#71717a" font-family="ui-monospace, Menlo, monospace" font-size="18">Next.js App Router · TypeScript · Zod · live demo on Vercel</text>
</svg>
